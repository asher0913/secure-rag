[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-rag-service"
version = "1.0.0"
description = "Permission-aware retrieval for multi-tenant RAG: fail-closed ACLs, pre-filtered ranking with per-view statistics, a live re-check against the directory of record, and audit events, with a benchmark of five enforcement designs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yixuan Zhang"}]
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.scripts]
secure-rag = "secure_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

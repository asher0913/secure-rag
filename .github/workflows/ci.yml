name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Benchmark reproduces the committed results
        run: |
          secure-rag benchmark --out /tmp/benchmark.json > /dev/null
          python -c "import json; assert json.load(open('/tmp/benchmark.json')) == json.load(open('results/benchmark.json')); print('reproduced')"
